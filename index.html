<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¡Te lo ruego!</title>
    <link rel="stylesheet" href="me_perdonas.css">
</head>
<body>
    <!-- El audio oculto -->
    <audio id="bg-music">
        <source src="cancion.mp3" type="audio/mpeg">
    </audio>

    <img src="foto/pngtree-landscapes-wallpaper-images-picture-image_3021437.jpg" alt="Fondo" class="background-img">
    
    <div class="card">
        <h1 id="question">¿Me perdonas? 🥺</h1>
        <p id="subtext">¡Me voy a morir de tristeza si no me perdonas!</p>
        
        <div class="buttons" id="buttons-container">
            <button id="btn-yes" class="btn btn-yes">Sí, te perdono</button>
            <button id="btn-no" class="btn btn-no">No</button>
        </div>
        
        <div id="message" class="hidden">
            <h2>¡Sabía que me salvarías la vida! ❤️</h2>
            <!-- Cambia "nuestra_foto.jpg" por el nombre de la imagen que quieres mostrar -->
            <img src="foto/nuestra_foto.jpg" alt="Felices" class="success-img">
        </div>
    </div>

    <script src="me_perdonas.js"></script>
</body>
</html>
