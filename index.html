<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Me perdonas?</title>
    <link rel="stylesheet" href="me_perdonas.css">
</head>
<body>
    <!-- 🎵 Aquí va tu música. Cambia 'cancion.mp3' por el nombre exacto de tu archivo de audio 🎵 -->
    <audio id="bg-music" loop>
        <source src="Idiota.cc).mp3" type="audio/mpeg">
    </audio>

    <!-- Imagen de fondo -->
    <img src="foto/pngtree-landscapes-wallpaper-images-picture-image_3021437.jpg" alt="Fondo" class="background-img">
    
    <div class="card">
        <h1 id="question">¿Me perdonas? 🥺</h1>
        <p id="subtext">Sé que me equivoqué, pero me importas mucho.</p>
        
        <div class="buttons" id="buttons-container">
            <button id="btn-yes" class="btn btn-yes">Sí</button>
            <button id="btn-no" class="btn btn-no">No</button>
        </div>
        
        <div id="message" class="hidden">
            <h2>¡Gracias! Sabía que dirías que sí ❤️</h2>
        </div>
    </div>

    <script src="me_perdonas.js"></script>
</body>
</html>
