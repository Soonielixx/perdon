<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Me perdonas?</title>
    <link rel="stylesheet" href="me_perdonas.css">
</head>
<body>
    <!-- Asegúrate de que la ruta a tu imagen sea correcta -->

    <div class="card">

        </div>
    </div>

    <script src="me_perdonas.js"></script>
